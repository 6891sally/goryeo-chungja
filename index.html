<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>고려청자 투자왕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 증권거래소 HTS 화면 — 상단 시세 띠, 좌측 종목, 우측 주문. 포스터만 밝은 종이색. 한 가지 어두운 화면으로 고정 */
:root{
  --ink:#0d181c; --panel:#13242a; --panel2:#183038; --line:#25434c;
  --fg:#e7f1ed; --muted:#8eaaa3; --celadon:#8fd1b8; --celadon-deep:#2f7d68;
  --up:#ff4f5f; --down:#4f8dff; --gold:#f6c64e;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --round:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.5;min-height:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.bar{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.logo-mark{width:34px;height:34px;border-radius:8px;background:var(--celadon-deep);display:grid;place-items:center;font-family:var(--display);font-size:18px;color:#eafff6}
.logo-text{font-family:var(--display);font-size:20px;letter-spacing:.02em;line-height:1}
.logo-text small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.18em;margin-top:3px}
.bar .spacer{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.who b{color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted);background:var(--panel)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.live .dot{background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.2)}
.pill.manual .dot{background:var(--gold)}
.linkbtn{white-space:nowrap;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted)}
.linkbtn:hover{color:var(--fg);border-color:var(--muted)}

.tape{overflow:hidden;border-top:1px solid var(--line);background:#0a1316;white-space:nowrap}
.tape-in{display:inline-flex;gap:36px;padding:7px 0;animation:tape 48s linear infinite;font-size:14px}
.tape-item{display:inline-flex;gap:8px;align-items:baseline}
.tape-item .code{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tape-item .up{color:var(--up);font-family:var(--mono)}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tape-in{animation:none}}

main{padding-block:24px 64px;max-width:1240px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--celadon);text-transform:uppercase}

/* home */
.home-head{display:grid;gap:10px;margin-bottom:28px}
.home-head h1{font-family:var(--display);font-size:clamp(34px,6vw,60px);font-weight:400;line-height:1.05}
.home-head h1 em{font-style:normal;color:var(--celadon)}
.home-head p{color:var(--muted);max-width:60ch;margin:0}
.home-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:820px){.home-grid{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.box h2{font-size:20px;font-weight:700;margin-bottom:6px}
.box p{color:var(--muted);margin:0 0 16px;font-size:15px}
.group-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:520px){.group-btns{grid-template-columns:repeat(3,1fr)}}
.gbtn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 6px;display:grid;gap:4px;justify-items:center}
.gbtn b{font-family:var(--display);font-size:30px;font-weight:400;line-height:1}
.gbtn span{font-size:13px;color:var(--muted)}
.gbtn:hover{border-color:var(--celadon)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:12px 18px;font-weight:700;border:1px solid transparent;font-size:16px}
.btn-main{background:var(--celadon);color:#062018}
.btn-main:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--panel2);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--muted)}
.btn-up{background:var(--up);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.steps-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
@media (max-width:820px){.steps-mini{grid-template-columns:repeat(2,1fr)}}
.steps-mini div{border-top:2px solid var(--line);padding-top:8px;font-size:14px;color:var(--muted)}
.steps-mini b{display:block;color:var(--fg);font-size:15px}

/* tablet tabs */
.tabs{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;padding-bottom:2px}
.tab{flex:1 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px;color:var(--muted)}
.tab .n{font-family:var(--mono);font-size:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.tab.on{color:var(--fg);border-color:var(--celadon);background:var(--panel2)}
.tab.on .n{background:var(--celadon);color:#062018;border-color:var(--celadon)}
.tab.done .n{border-color:var(--celadon);color:var(--celadon)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-head h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,36px)}
.sec-head p{margin:4px 0 0;color:var(--muted)}

/* listing cards */
.list-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:900px){.list-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.list-grid{grid-template-columns:1fr}}
.stock{position:relative;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:0;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.stock:hover{border-color:var(--muted)}
.stock:disabled{opacity:.55;cursor:not-allowed}
.stock:disabled:hover{border-color:var(--line)}
.stock.sel{border-color:var(--celadon);box-shadow:0 0 0 4px rgba(143,209,184,.18)}
.stock .ph{aspect-ratio:4/3;background:#d9dcd8;display:grid;place-items:center;overflow:hidden}
.stock .ph img{width:100%;height:100%;object-fit:contain}
.stock .meta{padding:12px 14px;display:grid;gap:4px}
.stock .row1{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.stock .row1 .num{color:var(--muted)}
.stock h3{font-size:18px;font-weight:700;line-height:1.3}
.stock .taken{position:absolute;top:10px;left:10px;background:rgba(13,24,28,.86);border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:3px 8px;font-size:13px;font-weight:700}
.stock .mine{position:absolute;top:10px;left:10px;background:var(--celadon);color:#062018;border-radius:6px;padding:3px 8px;font-size:13px;font-weight:700}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.note{font-size:14px;color:var(--muted)}
.warn{color:var(--gold)}

/* write */
.write{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
@media (max-width:860px){.write{grid-template-columns:1fr}}
.side{display:grid;gap:12px;position:sticky;top:120px}
@media (max-width:860px){.side{position:static}}
.side .ph{border-radius:12px;overflow:hidden;background:#d9dcd8;aspect-ratio:4/3}
.side .ph img{width:100%;height:100%;object-fit:contain}
.hint{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.hint h3{font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint ul{margin:10px 0 0;padding-left:18px;display:grid;gap:6px;font-size:15px}
.hint .src{font-size:12px;color:var(--muted);margin-top:10px}
.fields{display:grid;gap:14px}
.field{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.field label{font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.field label .q{font-weight:400;color:var(--muted);font-size:14px}
.field input,.field textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:17px;resize:none}
.field textarea{min-height:68px}
.field input:focus,.field textarea:focus{border-color:var(--celadon);outline:none}
.cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cnt.over{color:var(--up)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px dashed var(--line);border-radius:999px;padding:4px 10px;font-size:14px;color:var(--muted)}
.chip:hover{color:var(--fg);border-color:var(--celadon)}

/* poster */
.poster-area{display:grid;grid-template-columns:minmax(0,520px) 1fr;gap:22px;align-items:start}
@media (max-width:860px){.poster-area{grid-template-columns:1fr}}
.tpl-pick{display:grid;gap:10px}
.tpl{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px}
.tpl.on{border-color:var(--celadon)}
.tpl .sw{width:44px;height:58px;border-radius:6px;flex:none}
.tpl b{display:block}
.tpl span{font-size:14px;color:var(--muted)}

.poster{container-type:inline-size;width:100%;aspect-ratio:3/4;position:relative;overflow:hidden;border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
/* 템플릿 A: 홈쇼핑 특가 */
.pA{background:#ffe55a;color:#1d2a20;border:1.6cqw solid #2f7d68;display:grid;grid-template-rows:auto auto 1fr auto auto;font-family:var(--round)}
.pA .tagline{display:flex;justify-content:space-between;padding:2.6cqw 4cqw 0;font-size:2.6cqw;color:#2f7d68}
.pA .slogan{font-family:var(--display);font-size:8.6cqw;line-height:1.08;padding:1.6cqw 4cqw 0;color:#d6213a;text-shadow:.5cqw .5cqw 0 #fff;text-wrap:balance;word-break:keep-all}
.pA .mid{display:grid;grid-template-columns:44% 1fr;gap:3cqw;padding:2.4cqw 4cqw;align-items:center;min-height:0}
.pA .photo{background:#fff;border-radius:2cqw;aspect-ratio:1/1;overflow:hidden;display:grid;place-items:center;border:.6cqw solid #2f7d68;position:relative}
.pA .photo img{width:100%;height:100%;object-fit:contain}
.pA .burst{position:absolute;right:-1cqw;top:-1cqw;background:#d6213a;color:#fff;font-family:var(--display);font-size:3cqw;padding:1.4cqw 2cqw;border-radius:50%;transform:rotate(12deg);line-height:1.1;text-align:center}
.pA .name{display:grid;gap:1.2cqw}
.pA .name small{font-size:3cqw;color:#2f7d68}
.pA .name b{font-family:var(--display);font-weight:400;font-size:6.4cqw;line-height:1.1;word-break:keep-all}
.pA .name .code{font-family:var(--mono);font-size:2.6cqw;background:#1d2a20;color:#ffe55a;padding:.6cqw 1.6cqw;border-radius:1cqw;justify-self:start}
.pA .cells{display:grid;grid-template-columns:1fr 1fr;gap:1.8cqw;padding:0 4cqw}
.pA .cell{background:#fff;border:.5cqw solid #1d2a20;border-radius:1.6cqw;padding:1.8cqw 2.2cqw;min-height:15cqw}
.pA .cell h4{margin:0 0 .8cqw;font-size:3.1cqw;color:#2f7d68;font-family:var(--round);font-weight:400}
.pA .cell p{margin:0;font-size:3.3cqw;line-height:1.35;word-break:keep-all}
.pA .cta{margin:2.6cqw 4cqw 3cqw;background:#1d2a20;color:#ffe55a;border-radius:2cqw;display:flex;justify-content:space-between;align-items:center;padding:2cqw 3.4cqw;font-family:var(--display);font-size:4.4cqw}
.pA .cta span{background:#d6213a;color:#fff;border-radius:1.4cqw;padding:.6cqw 2.4cqw}
/* 템플릿 B: 증권 리포트 */
.pB{background:#fbfaf6;color:#18252a;font-family:var(--body);display:grid;grid-template-rows:auto auto auto 1fr auto}
.pB .hd{background:#13242a;color:#e7f1ed;display:flex;justify-content:space-between;align-items:center;padding:2.6cqw 4cqw;font-size:2.5cqw}
.pB .hd b{font-family:var(--display);font-weight:400;font-size:3.6cqw;letter-spacing:.02em}
.pB .title{padding:3.4cqw 4cqw 1cqw;display:grid;gap:1cqw;border-bottom:.3cqw solid #18252a}
.pB .title small{font-family:var(--mono);font-size:2.4cqw;color:#5b6f6a}
.pB .title h3{font-family:var(--display);font-weight:400;font-size:7.4cqw;line-height:1.1;word-break:keep-all}
.pB .title p{margin:0 0 1.6cqw;font-size:3.4cqw;font-weight:700;color:#2f7d68;word-break:keep-all}
.pB .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:.2cqw solid #c9d1cd}
.pB .kpis div{padding:2cqw 3cqw;border-right:.2cqw solid #c9d1cd;display:grid;gap:.4cqw}
.pB .kpis div:last-child{border-right:0}
.pB .kpis small{font-size:2.2cqw;color:#5b6f6a}
.pB .kpis b{font-size:3.8cqw;font-family:var(--display);font-weight:400}
.pB .kpis .buy{color:#d6213a}
.pB .body{display:grid;grid-template-columns:40% 1fr;gap:3cqw;padding:3cqw 4cqw;min-height:0}
.pB .left{display:grid;gap:2cqw;align-content:start}
.pB .photo{background:#e6e8e4;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}
.pB .photo img{width:100%;height:100%;object-fit:contain}
.pB .chart{border:.2cqw solid #c9d1cd;padding:1.4cqw}
.pB .chart small{font-size:2cqw;color:#5b6f6a;display:block}
.pB .chart svg{width:100%;height:auto;display:block}
.pB .points{display:grid;gap:1.8cqw;align-content:start}
.pB .points h4{margin:0;font-size:2.6cqw;letter-spacing:.1em;color:#5b6f6a;font-weight:500}
.pB .pt{display:grid;grid-template-columns:5cqw 1fr;gap:1.4cqw;border-top:.2cqw solid #c9d1cd;padding-top:1.6cqw}
.pB .pt i{font-style:normal;font-family:var(--mono);font-size:3cqw;color:#d6213a;font-weight:600}
.pB .pt b{display:block;font-size:2.7cqw;color:#2f7d68}
.pB .pt p{margin:.4cqw 0 0;font-size:3.2cqw;line-height:1.38;word-break:keep-all}
.pB .ft{background:#d6213a;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:2.4cqw 4cqw;font-family:var(--display);font-size:4.2cqw}
.pB .ft small{font-family:var(--body);font-size:2.2cqw;opacity:.9}
.empty-txt{color:#9aa5a0 !important}

.stage{position:fixed;inset:0;z-index:100;background:#071013;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.stage .poster{width:min(94vw, calc((100vh - 70px) * .75));border-radius:4px}
.stage .close{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700}

/* order */
.order{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
@media (max-width:900px){.order{grid-template-columns:1fr}}
.acct{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;position:sticky;top:120px}
@media (max-width:900px){.acct{position:static}}
.acct .lbl{font-size:13px;color:var(--muted)}
.acct .big{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.1}
.acct .big.zero{color:var(--celadon)}
.meter{height:10px;border-radius:5px;background:var(--ink);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.acct .rows{display:grid;gap:4px;font-size:14px}
.acct .rows div{display:flex;justify-content:space-between}
.orders{display:grid;gap:12px}
.ord{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
@media (max-width:640px){.ord{grid-template-columns:auto 1fr}.ord .stepper{grid-column:1/-1}}
.ord .thumb{width:64px;height:64px;border-radius:10px;background:#d9dcd8;overflow:hidden;display:grid;place-items:center;font-family:var(--display);color:#3c4b47;font-size:22px}
.ord .thumb img{width:100%;height:100%;object-fit:contain}
.ord .info{display:grid;gap:2px;min-width:0}
.ord .info small{font-size:13px;color:var(--muted)}
.ord .info b{font-size:17px}
.ord select{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:15px;max-width:100%}
.ord .memo{grid-column:2/-1;width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px}
@media (max-width:640px){.ord .memo{grid-column:1/-1}}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:22px;font-weight:700;line-height:1}
.stepper button.plus{color:var(--up)}
.stepper button.minus{color:var(--down)}
.stepper .amt{min-width:120px;text-align:center;font-family:var(--mono);font-size:19px;font-weight:600}
.stepper .amt.has{color:var(--up)}
.confirm-box{border:1px solid var(--gold);background:rgba(246,198,78,.08);border-radius:12px;padding:14px;display:grid;gap:10px}
.slip{background:#fbfaf6;color:#18252a;border-radius:6px;padding:18px;display:grid;gap:10px;font-size:15px}
.slip h3{font-family:var(--display);font-weight:400;font-size:24px;display:flex;justify-content:space-between;align-items:baseline}
.slip h3 small{font-family:var(--mono);font-size:12px;color:#5b6f6a}
.slip table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.slip td,.slip th{border-bottom:1px dashed #b8c2bd;padding:7px 4px;text-align:left}
.slip td:last-child,.slip th:last-child{text-align:right;font-family:var(--mono)}
.slip .stamp{justify-self:end;border:3px solid #d6213a;color:#d6213a;font-family:var(--display);padding:4px 12px;transform:rotate(-6deg);border-radius:6px;font-size:20px}

/* board */
.board-head{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.board-head h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,48px);line-height:1.05}
.board-tools{display:flex;gap:8px;flex-wrap:wrap}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.board{width:100%;border-collapse:collapse;min-width:720px}
.board th{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);background:#0f1d22}
.board td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.board tr:last-child td{border-bottom:0}
.board .r{text-align:right}
.board .stk{display:flex;gap:12px;align-items:center}
.board .stk .t{width:52px;height:52px;border-radius:8px;background:#d9dcd8;overflow:hidden;flex:none;display:grid;place-items:center;color:#3c4b47;font-family:var(--display)}
.board .stk .t img{width:100%;height:100%;object-fit:contain}
.board .stk b{display:block;font-size:17px}
.board .stk small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.board .grp{font-family:var(--display);font-size:22px}
.board .amt{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--up)}
.board .hidden-amt{font-family:var(--mono);font-size:22px;color:var(--muted);letter-spacing:.1em}
.board .barcell{width:28%}
.hbar{height:14px;border-radius:7px;background:var(--ink);overflow:hidden}
.hbar i{display:block;height:100%;background:linear-gradient(90deg,var(--celadon-deep),var(--up));width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.rank{display:inline-grid;place-items:center;min-width:46px;height:34px;border-radius:8px;font-family:var(--display);font-size:18px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.rank.r1{background:var(--gold);color:#2a1d00;border-color:var(--gold)}
tr.win td{background:rgba(246,198,78,.08)}
tr.flash td{animation:flash 1.2s ease}
@keyframes flash{0%{background:rgba(255,79,95,.35)}100%{background:transparent}}
.status-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
@media (max-width:700px){.status-row{grid-template-columns:repeat(2,1fr)}}
.st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.st small{font-size:12px;color:var(--muted)}
.st b{font-size:15px}
.st.ok{border-color:var(--celadon-deep)}
.st.ok b{color:var(--celadon)}
.drum{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(7,16,19,.82);pointer-events:none}
.drum div{font-family:var(--display);font-size:clamp(40px,9vw,110px);color:var(--gold);animation:pulse .5s ease-in-out infinite alternate;text-align:center;line-height:1.1}
.drum div small{display:block;font-size:.35em;color:var(--fg)}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
.winner{margin-top:16px;border:2px solid var(--gold);border-radius:14px;padding:18px 20px;display:flex;gap:18px;align-items:center;background:rgba(246,198,78,.07);flex-wrap:wrap}
.winner .crown{font-family:var(--display);font-size:22px;color:#2a1d00;background:var(--gold);border-radius:10px;padding:8px 14px}
.winner h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,4vw,38px)}
.winner p{margin:2px 0 0;color:var(--muted)}
details.panel{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
details.panel>summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary span{font-weight:400;color:var(--muted);font-size:14px}
details.panel .inner{padding:0 18px 18px}
.grid-in{overflow-x:auto}
.grid-in table{border-collapse:collapse;min-width:640px;width:100%}
.grid-in th,.grid-in td{border:1px solid var(--line);padding:6px;text-align:center;font-size:14px}
.grid-in th{color:var(--muted);font-weight:500;background:#0f1d22}
.grid-in input{width:100%;min-width:76px;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px;text-align:right;font-family:var(--mono)}
.grid-in select{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px;max-width:150px}
.grid-in td.self{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.04) 6px 12px);color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.gallery button{background:none;border:0;padding:0;display:grid;gap:6px;text-align:left}
.gallery button span{font-size:14px;color:var(--muted)}
.memos{display:grid;gap:8px;margin-top:6px;font-size:14px}
.memos div{border-left:2px solid var(--celadon-deep);padding-left:10px;color:var(--muted)}
.memos b{color:var(--fg)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--celadon);color:#062018;font-weight:700;padding:10px 18px;border-radius:10px;z-index:120}
</style>

function applyState(d){
  if(!d||!d.listings) return false;
  const j=JSON.stringify([d.listings,d.orders,d.closed]);
  listings=d.listings; orders=d.orders||{}; closed=!!d.closed;

  }catch(e){ markOnline(false); return null; }
}

  const step=200/(pts.length-1);
  const d=pts.map((y,i)=>`${i?"L":"M"}${(i*step).toFixed(1)},${y}`).join(" ");
  return `<svg viewBox="0 0 200 70" aria-hidden="true"><path d="${d} L200,70 L0,70 Z" fill="#d6213a" fill-opacity=".12"/><path d="${d}" fill="none" stroke="#d6213a" stroke-width="2.5"/><circle cx="200" cy="14" r="3.5" fill="#d6213a"/></svg>`;
}

function showStage(html){
  const L=$("#layer");
  L.innerHTML=`<div class="stage" role="dialog" aria-label="포스터 크게 보기">${html}<button class="close" id="stClose">닫기 ✕</button></div>`;
  $("#stClose").onclick=()=>{ L.innerHTML=""; try{ document.fullscreenElement&&document.exitFullscreen(); }catch(e){} };
  try{ document.documentElement.requestFullscreen?.().catch(()=>{}); }catch(e){}
}

function used(){ return GROUPS.reduce((a,g)=>a+(S.alloc["g"+g]||0),0); }
let confirming=false;
function paneOrder(){
  const others=GROUPS.filter(g=>g!==S.group);
  const left=BUDGET-used();
  if(S.submitted){ return paneSlip(); }
  if(closed){ $("#pane").innerHTML=`<div class="box" style="max-width:560px"><span class="eyebrow">주문 마감</span><h2 style="margin-top:6px">투자 주문이 마감됐어요</h2><p>선생님이 주문을 마감해서 더 이상 투자할 수 없어요.</p></div>`; return; }
  const colors=["#ff4f5f","#f6c64e","#8fd1b8","#4f8dff"];
  $("#pane").innerHTML=`
  <div class="sec-head"><div><h2>투자 주문</h2><p>다른 모둠의 광고를 떠올리며 1억을 나눠 투자하세요. 우리 모둠에는 투자할 수 없어요.</p></div></div>
  <div class="order">
    <div class="orders">${others.map(g=>{
      const id=itemOf(g), it=id?ITEM[id]:null, a=S.alloc["g"+g]||0, known=!!(listings["g"+g]&&listings["g"+g].item);
      return `<div class="ord">
        <div class="thumb">${it?`<img src="${IMG[it.id]}" alt="">`:g}</div>
        <div class="info"><small>${g}모둠 종목</small>
          ${known?`<b>${esc(it.name)}</b>`:`<select data-guess="${g}" aria-label="${g}모둠이 광고한 청자"><option value="">청자를 고르세요</option>${ITEMS.filter(i=>i.id!==S.item).map(i=>`<option value="${i.id}" ${S.guess["g"+g]===i.id?"selected":""}>${esc(i.name)}</option>`).join("")}</select>`}
        </div>
        <div class="stepper"><button class="minus" data-m="${g}" aria-label="${g}모둠 투자금 줄이기">−</button><span class="amt ${a?"has":""}">${won(a)}</span><button class="plus" data-p="${g}" aria-label="${g}모둠 투자금 늘리기" ${left<STEP?"disabled":""}>+</button></div>
        <input class="memo" data-memo="${g}" maxlength="40" placeholder="투자하는 이유 한 줄 (예: 지금도 쓸모가 많아서)" value="${esc(S.memo["g"+g]||"")}">
      </div>`;}).join("")}
    </div>
    <aside class="acct">
      <div><div class="lbl">${S.group}모둠 투자 가능 금액</div><div class="big num ${left===0?"zero":""}">${won(left)}</div></div>
      <div class="meter" aria-hidden="true">${others.map((g,i)=>`<i style="width:${(S.alloc["g"+g]||0)/BUDGET*100}%;background:${colors[i]}"></i>`).join("")}</div>
      <div class="rows">${others.map((g,i)=>`<div><span><span style="color:${colors[i]}">■</span> ${g}모둠</span><span class="num">${won(S.alloc["g"+g]||0)}</span></div>`).join("")}
        <div style="border-top:1px solid var(--line);padding-top:6px;margin-top:4px"><span>투자한 돈</span><span class="num">${won(used())}</span></div></div>
      <p class="note">+ 버튼 한 번에 500만 원씩 투자해요.</p>
      <div id="cf"></div>
    </aside>
  </div>`;
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ const k="g"+b.dataset.p; if(BUDGET-used()>=STEP){ S.alloc[k]=(S.alloc[k]||0)+STEP; save(); confirming=false; paneOrder(); } });
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ const k="g"+b.dataset.m; S.alloc[k]=Math.max(0,(S.alloc[k]||0)-STEP); save(); confirming=false; paneOrder(); });
  document.querySelectorAll("[data-guess]").forEach(s=>s.onchange=()=>{ S.guess["g"+s.dataset.guess]=s.value; save(); paneOrder(); });
  document.querySelectorAll("[data-memo]").forEach(m=>{
    m.addEventListener("focus",()=>typing=true); m.addEventListener("blur",()=>typing=false);
    m.addEventListener("input",()=>{ S.memo["g"+m.dataset.memo]=m.value; save(); });
  });
  const cf=$("#cf");
  if(!confirming){
    cf.innerHTML=`<button class="btn btn-up" id="sub" style="width:100%" ${used()?"":"disabled"}>주문 체결하기</button>${left>0&&used()?`<p class="note warn" style="margin:8px 0 0">아직 ${won(left)}이 남았어요. 그대로 체결해도 돼요.</p>`:""}`;
    $("#sub").onclick=()=>{ confirming=true; paneOrder(); };
  }else{
    cf.innerHTML=`<div class="confirm-box"><b>정말 체결할까요?</b><span class="note">모둠원 모두 동의했는지 확인하세요.</span><div style="display:flex;gap:8px"><button class="btn btn-up" id="yes">네, 체결</button><button class="btn btn-ghost" id="no">다시 생각</button></div></div>`;
    $("#no").onclick=()=>{ confirming=false; paneOrder(); };
    $("#yes").onclick=async()=>{
      $("#yes").disabled=true; $("#yes").textContent="전송 중…";
      const d=await api("order",{group:S.group,alloc:S.alloc,memo:S.memo});
      confirming=false;
      if(d && d.ok===false && d.reason==="closed"){ toast("주문이 마감됐어요"); renderGroup(); return; }
      S.submitted=true; S.submittedAt=Date.now(); S.sentOK=!!(d&&d.ok!==false); save(); renderGroup();
    };
  }
}
function paneSlip(){
  const others=GROUPS.filter(g=>g!==S.group);
  const t=new Date(S.submittedAt||Date.now());
  $("#pane").innerHTML=`
  <div class="sec-head"><div><h2>주문 체결 완료</h2><p>${S.sentOK?"구글 시트로 주문이 전송됐어요."+(closed?" 주문이 마감되어 더 고칠 수 없어요.":""):"전송되지 않았어요. 이 화면을 선생님께 보여 주세요."}</p></div></div>

      <tr><td><b>합계</b></td><td><b>${won(used())}</b></td></tr></tbody></table>

  </div>`;
  const rd=$("#redo"); if(rd) rd.onclick=()=>{ S.submitted=false; save(); renderGroup(); };
}

/* ---------- 선생님 전광판 ---------- */
function orderOf(g){ // 투자자 g의 주문: 직접 입력이 있으면 그것을, 없으면 전송된 주문
  const m=S.manual["g"+g]; if(m && m.touched) return {alloc:m.alloc||{}, src:"manual"};
  const o=orders["g"+g]; if(o) return {alloc:o.alloc||{}, memo:o.memo||{}, src:"live"};
  return null;
}
function totals(){
  const t={}, cnt={}; GROUPS.forEach(g=>{t[g]=0;cnt[g]=0;});
  GROUPS.forEach(inv=>{ const o=orderOf(inv); if(!o) return;
    GROUPS.forEach(g=>{ if(g===inv) return; const a=+o.alloc["g"+g]||0; if(a>0){ t[g]+=a; cnt[g]++; } }); });
  return {t,cnt};
}
function ranks(t){ const sorted=[...GROUPS].sort((a,b)=>t[b]-t[a]); const r={}; sorted.forEach(g=>{ r[g]=1+sorted.filter(x=>t[x]>t[g]).length; }); return {r,sorted}; }
let revealing=false;
function renderBoard(){
  const {t,cnt}=totals(); const {r,sorted}=ranks(t); const max=Math.max(1,...GROUPS.map(g=>t[g]));
  const order=[...sorted].reverse(); // 5위부터 공개
  const shown=new Set(order.slice(0,S.revealed));
  const all=S.revealed>=GROUPS.length;
  const rows = all ? sorted : GROUPS;
  const nOrders=GROUPS.filter(g=>orderOf(g)).length;
  const keepOpen=[...document.querySelectorAll("details.panel")].filter(d=>d.open).map(d=>d.id);
  $("#app").innerHTML=`
  <div class="board-head">
    <div><span class="eyebrow">KCX 실시간 전광판</span><h1>고려청자 투자왕</h1></div>
    <div class="board-tools">
      <button class="btn btn-up" id="reveal" ${all||revealing?"disabled":""}>${S.revealed===0?"두구두구 결과 발표":"다음 순위 공개"}</button>
      <button class="btn ${closed?"btn-ghost":"btn-main"}" id="closeBtn" ${hasAPI?"":"disabled"}>${closed?"주문 마감 풀기":"주문 마감하기"}</button>
      <button class="btn btn-ghost" id="hideAll" ${S.revealed?"":"disabled"}>결과 가리기</button>
    </div>
  </div>
  <div class="status-row">${GROUPS.map(g=>{const id=itemOf(g); const o=orderOf(g);
    return `<div class="st ${o?"ok":""}"><small>${g}모둠 · ${id?"상장 완료":"상장 대기"}</small><b>${o?(o.src==="manual"?"주문 입력됨":"주문 체결"):"주문 대기"}</b></div>`;}).join("")}</div>
  <div class="tblwrap"><table class="board">
    <thead><tr><th>순위</th><th>모둠</th><th>종목</th><th class="r">투자한 모둠</th><th class="r">모인 투자금</th><th>그래프</th></tr></thead>
    <tbody>${rows.map(g=>{const id=itemOf(g), it=id?ITEM[id]:null, sh=shown.has(g)||all;
      return `<tr class="${sh&&r[g]===1&&all?"win":""}" data-row="${g}">
        <td>${sh?`<span class="rank ${r[g]===1?"r1":""}">${r[g]}위</span>`:`<span class="rank">?</span>`}</td>
        <td class="grp">${g}모둠</td>
        <td><div class="stk"><span class="t">${it?`<img src="${IMG[it.id]}" alt="">`:"?"}</span><span><b>${it?esc(it.name):"상장 대기"}</b><small>${it?it.code+" · "+it.sector:""}</small></span></div></td>
        <td class="r num">${sh?cnt[g]+"곳":"–"}</td>
        <td class="r">${sh?`<span class="amt">${won(t[g])}</span>`:`<span class="hidden-amt">●●●●</span>`}</td>
        <td class="barcell"><div class="hbar"><i style="width:${sh?(t[g]/max*100):0}%"></i></div></td>
      </tr>`;}).join("")}</tbody></table></div>
  ${all?(()=>{const w=sorted.filter(g=>r[g]===1); return `<div class="winner"><span class="crown">투자왕</span><div><h2>${w.map(g=>g+"모둠").join(" · ")} ${w.length===1&&itemOf(w[0])?"· "+esc(ITEM[itemOf(w[0])].name):""}</h2><p>모인 투자금 ${won(t[w[0]])} · 투자자 ${cnt[w[0]]}모둠</p></div></div>`;})():""}
  <p class="note" style="margin-top:10px">주문 ${nOrders}/5 접수 · ${closed?'<b class="warn">주문 마감됨 (태블릿에서 정정 불가)</b>':"주문 받는 중"} · 투자금은 순위 공개 전까지 가려져 있어요.</p>

  <details class="panel" id="pMemo"><summary>투자자 한마디 <span>모둠들이 쓴 투자 이유</span></summary><div class="inner">
    ${GROUPS.map(g=>{ const lines=[]; GROUPS.forEach(inv=>{ const o=orders["g"+inv]; const m=o&&o.memo&&o.memo["g"+g]; if(m&&m.trim()) lines.push(`<div><b>${inv}모둠 →</b> ${esc(m)}</div>`); });
      return `<div style="margin-bottom:12px"><b>${g}모둠 종목에게</b><div class="memos">${lines.join("")||'<div>아직 없어요</div>'}</div></div>`;}).join("")}
  </div></details>

  <details class="panel" id="pGal"><summary>포스터 모아보기 <span>모둠 태블릿에서 만든 포스터</span></summary><div class="inner">
    <div class="gallery">${GROUPS.filter(g=>listings["g"+g]&&listings["g"+g].item).map(g=>{const L=listings["g"+g]; return `<button data-pg="${g}">${posterHTML(g,L.item,L.ad,L.tpl)}<span>${g}모둠 · 눌러서 크게 보기</span></button>`;}).join("")||'<p class="note">아직 시트에 올라온 포스터가 없어요.</p>'}</div>
  </div></details>

  <details class="panel" id="pManual"><summary>주문 직접 입력 <span>인터넷이 끊겨 주문이 안 들어왔을 때 · 단위 만 원</span></summary><div class="inner">
    <p class="note" style="margin-top:0">각 모둠 태블릿의 ‘투자 체결 확인서’를 보고 입력하세요. 한 줄이라도 입력하면 그 모둠은 직접 입력한 값이 쓰여요.</p>
    <div class="grid-in"><table><thead><tr><th>투자자 ↓ / 받는 모둠 →</th>${GROUPS.map(g=>`<th>${g}모둠</th>`).join("")}<th>합계</th><th></th></tr></thead><tbody>
    ${GROUPS.map(inv=>{const m=S.manual["g"+inv]||{}; const o=orderOf(inv); const al=(o&&o.alloc)||{}; const sum=GROUPS.reduce((a,g)=>a+(g===inv?0:(+al["g"+g]||0)),0);
      return `<tr><th>${inv}모둠</th>${GROUPS.map(g=>g===inv?`<td class="self">자기 모둠</td>`:`<td><input inputmode="numeric" data-mi="${inv}" data-mg="${g}" value="${al["g"+g]?al["g"+g]:""}" placeholder="0" aria-label="${inv}모둠이 ${g}모둠에 투자한 금액(만 원)"></td>`).join("")}
      <td class="num ${sum>BUDGET?"warn":""}">${sum.toLocaleString("ko-KR")}</td><td>${m.touched?`<button class="linkbtn" data-clr="${inv}">입력 지우기</button>`:""}</td></tr>`;}).join("")}
    <tr><th>상장 종목</th>${GROUPS.map(g=>`<td><select data-mitem="${g}" aria-label="${g}모둠 청자"><option value="">${listings["g"+g]&&listings["g"+g].item?"(태블릿에서 선택됨)":"선택"}</option>${ITEMS.map(i=>`<option value="${i.id}" ${S.manualItem["g"+g]===i.id?"selected":""}>${esc(i.name)}</option>`).join("")}</select></td>`).join("")}<td></td><td></td></tr>
    </tbody></table></div>
  </div></details>

  <details class="panel" id="pReset"><summary>새 수업 준비 <span>모든 기록 지우기</span></summary><div class="inner" id="resetBox">
    <p class="note" style="margin-top:0">다른 반 수업 전에 상장·주문 기록과 직접 입력한 값을 지웁니다. 지운 기록은 구글 시트의 ‘지난 기록’ 탭에 남아요.</p>
    <button class="btn btn-ghost" id="reset1">기록 지우기</button>
  </div></details>`;
  keepOpen.forEach(id=>{ const d=document.getElementById(id); if(d) d.open=true; });

  $("#reveal").onclick=()=>{
    if(nOrders===0){ toast("아직 접수된 주문이 없어요"); return; }
    if(S.revealed===0){
      revealing=true; renderBoard();
      const L=$("#layer"); L.innerHTML=`<div class="drum"><div>두구두구두구<small>가장 많은 투자금을 모은 모둠은?</small></div></div>`;
      setTimeout(()=>{ L.innerHTML=""; revealing=false; S.revealed=1; save(); renderBoard(); flash(order[0]); },2400);
    }else{
      const next=order[S.revealed];
      if(S.revealed===GROUPS.length-1){
        revealing=true; renderBoard();
        const L=$("#layer"); L.innerHTML=`<div class="drum"><div>대망의 1위는…</div></div>`;
        setTimeout(()=>{ L.innerHTML=""; revealing=false; S.revealed=GROUPS.length; save(); renderBoard(); },2400);
      }else{ S.revealed++; save(); renderBoard(); flash(next); }
    }
  };
  $("#hideAll").onclick=()=>{ S.revealed=0; save(); renderBoard(); };
  $("#closeBtn").onclick=async()=>{
    const b=$("#closeBtn"); b.disabled=true;
    const d=await api("close",{pass:teacherPass,closed:!closed});
    if(!d||d.ok===false) toast("시트에 연결되지 않아 바꾸지 못했어요");
    else toast(closed?"주문을 마감했어요":"주문을 다시 받아요");
    renderBoard();
  };
  document.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{ const L=listings["g"+b.dataset.pg]; showStage(posterHTML(+b.dataset.pg,L.item,L.ad,L.tpl)); });
  document.querySelectorAll("[data-mi]").forEach(inp=>{
    inp.addEventListener("focus",()=>typing=true);
    inp.addEventListener("change",()=>{
      typing=false;
      const inv=inp.dataset.mi, k="g"+inv;
      const base=(orderOf(+inv)&&orderOf(+inv).alloc)||{};
      const m=S.manual[k]&&S.manual[k].touched? S.manual[k] : {alloc:{...base}};
      const n=Math.max(0,Math.round(+String(inp.value).replace(/[^0-9]/g,"")||0));
      m.alloc["g"+inp.dataset.mg]=n; m.touched=true; S.manual[k]=m; save(); renderBoard();
    });
    inp.addEventListener("blur",()=>typing=false);
  });
  document.querySelectorAll("[data-clr]").forEach(b=>b.onclick=()=>{ delete S.manual["g"+b.dataset.clr]; save(); renderBoard(); });
  document.querySelectorAll("[data-mitem]").forEach(s=>s.onchange=()=>{ S.manualItem["g"+s.dataset.mitem]=s.value; save(); renderBoard(); });
  $("#reset1").onclick=()=>{
    $("#resetBox").innerHTML=`<div class="confirm-box"><b>정말 모두 지울까요?</b><span class="note">태블릿에 남은 내용은 각 태블릿 첫 화면의 ‘이 태블릿 기록 지우기’로 지워요.</span><div style="display:flex;gap:8px"><button class="btn btn-up" id="reset2">모두 지우기</button><button class="btn btn-ghost" id="reset0">취소</button></div></div>`;
    $("#reset0").onclick=()=>renderBoard();
    $("#reset2").onclick=async()=>{
      S.manual={}; S.manualItem={}; S.revealed=0; save();
      if(hasAPI){ const d=await api("reset",{pass:teacherPass}); if(!d||d.ok===false){ toast("시트 기록은 지우지 못했어요"); renderBoard(); return; } }
      toast("기록을 지웠어요"); renderBoard();
    };
  };
}
function flash(g){ const tr=document.querySelector(`tr[data-row="${g}"]`); if(tr){ tr.classList.add("flash"); } }

$("#goHome").onclick=()=>{ S.role=null; unlocked=false; save(); render(); };
render();
initAPI();
</script>

</body>
</html>
